<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140a1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poder do Cocô">
  <meta name="description" content="Miguel precisa fazer cocô nos monstros para salvar a mamãe e o Simba!">
  <title>Poder do Cocô</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="screen"></canvas>

    <div id="controls" hidden>
      <div id="pad-move" aria-label="andar">
        <div class="btn left" aria-label="esquerda">
          <svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" /></svg>
        </div>
        <div class="btn right" aria-label="direita">
          <svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" /></svg>
        </div>
      </div>
      <div id="pad-action">
        <div class="btn jump" aria-label="pular">
          <svg viewBox="0 0 24 24"><path d="M4 15 L12 7 L20 15" /></svg>
        </div>
        <div class="btn poop" aria-label="fazer cocô"><span>💩</span></div>
      </div>
    </div>

    <div id="topbar" hidden>
      <button id="btn-fs" aria-label="tela cheia" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
      <button id="btn-mute" aria-label="som">🔊</button>
      <button id="btn-pause" aria-label="pausa">❚❚</button>
    </div>
    <button id="btn-skip" hidden>PULAR ▶▶</button>
    <button id="btn-install" hidden>📲 INSTALAR</button>
    <div id="install-help" hidden>
      <div class="card">
        <h2>Instalar no iPhone</h2>
        <ol>
          <li>Toque em
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8" /></svg>
            <b>Compartilhar</b> na barra do navegador.</li>
          <li>Escolha <b>“Adicionar à Tela de Início”</b>
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 5h14v14H5zM12 8.5v7M8.5 12h7" /></svg></li>
          <li>Toque em <b>Adicionar</b>.</li>
        </ol>
        <p>Depois é só abrir o <b>Poder do Cocô</b> pelo ícone 💩 na tela inicial: ele abre em <b>tela cheia</b> e funciona até sem internet!</p>
        <button id="install-ok">ENTENDI!</button>
      </div>
    </div>
    <div id="menu" hidden></div>

    <div id="rotate" hidden>
      <div class="phone"><span>💩</span></div>
      <p>Vire o celular<br>para jogar!</p>
    </div>
  </div>
  <noscript>Este jogo precisa de JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
