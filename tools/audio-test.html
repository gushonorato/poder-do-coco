<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de áudio — Poder do Cocô</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1d1a2b; color: #f3eee6; margin: 16px; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 20px; }
  button { font: inherit; margin: 3px; padding: 8px 12px; border-radius: 8px; border: 0; background: #6b4a2b; color: #fff; }
  button.music { background: #2b5b8a; }
  button.util { background: #3b6b3b; }
  pre { background: #0f0d18; padding: 10px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; }
  #lvl { display: inline-block; width: 200px; height: 10px; background: #333; vertical-align: middle; }
  #lvl i { display: block; height: 100%; width: 0; background: #f7b733; }
</style>
</head>
<body>
<h1>💩 Teste de áudio — Poder do Cocô</h1>
<button class="util" id="unlock">🔊 Ativar áudio</button>
<button class="util" id="mute">Mudo: não</button>
<button class="util" id="pause">Pausar</button>
<button class="util" id="resume">Retomar</button>

<h2>Efeitos</h2>
<div id="sfx"></div>
<button class="util" id="bigfart">Pum grande (pitch 0.7)</button>

<h2>Músicas</h2>
<div id="music"></div>
<button class="util" id="stop">⏹ Parar música</button>

<h2>Voz</h2>
<button class="util" id="voice">Fala (fallback speechSynthesis)</button>
<button class="util" id="voiceFile">Fala (arquivo assets/voice/intro.mp3)</button>
<button class="util" id="voiceStop">Parar fala</button>
<span id="lvl"><i></i></span>

<h2>Verificação automática (?auto=1)</h2>
<pre id="results">Abra com ?auto=1 para renderizar tudo offline.</pre>
<div id="wavs"></div>

<script type="module">
import { audio } from '../js/audio.js';

const $ = (id) => document.getElementById(id);
const errors = [];
window.addEventListener('error', (e) => errors.push('window.error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));

$('unlock').onclick = () => audio.unlock();
$('mute').onclick = () => { audio.setMuted(!audio.muted); $('mute').textContent = 'Mudo: ' + (audio.muted ? 'sim' : 'não'); };
$('mute').textContent = 'Mudo: ' + (audio.muted ? 'sim' : 'não');
$('pause').onclick = () => audio.pause();
$('resume').onclick = () => audio.resume();
for (const n of audio.sfxNames) {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => { audio.unlock(); audio.sfx(n); };
  $('sfx').appendChild(b);
}
$('bigfart').onclick = () => { audio.unlock(); audio.sfx('fart', { pitch: 0.7 }); };
for (const n of audio.musicNames) {
  const b = document.createElement('button');
  b.textContent = '♪ ' + n;
  b.className = 'music';
  b.onclick = () => { audio.unlock(); audio.playMusic(n); };
  $('music').appendChild(b);
}
$('stop').onclick = () => audio.stopMusic();

audio.loadVoice('fake', '../assets/voice/__nao_existe__.mp3', 'Miguel, o monstro Constipador raptou eu e o Simba! Faça cocô e nos salve, Miguel!');
audio.loadVoice('intro', '../assets/voice/intro.mp3', 'Miguel, o monstro Constipador raptou eu e o Simba!');
$('voice').onclick = () => { audio.unlock(); audio.playMusic('cutscene'); audio.playVoice('fake').then(() => console.log('fala terminou')); };
$('voiceFile').onclick = () => { audio.unlock(); audio.playMusic('cutscene'); audio.playVoice('intro'); };
$('voiceStop').onclick = () => audio.stopVoice();
(function loop() { $('lvl').firstChild.style.width = (audio.voiceLevel() * 100).toFixed(0) + '%'; requestAnimationFrame(loop); })();

// ---------- verificação automática
function stats(buf) {
  const d = buf.getChannelData(0);
  let sum = 0, peak = 0, first = -1, last = -1;
  for (let i = 0; i < d.length; i++) {
    const a = Math.abs(d[i]);
    sum += d[i] * d[i];
    if (a > peak) peak = a;
    if (a > 0.003) { if (first < 0) first = i; last = i; }
  }
  const rms = Math.sqrt(sum / d.length);
  const active = first < 0 ? 0 : (last - first) / buf.sampleRate;
  // RMS só da parte ativa (mais útil para sons curtos)
  let s2 = 0;
  for (let i = Math.max(0, first); i <= last; i++) s2 += d[i] * d[i];
  const rmsActive = first < 0 ? 0 : Math.sqrt(s2 / Math.max(1, last - first + 1));
  return { rms, rmsActive, peak, active };
}

function wavBase64(buf, seconds) {
  const d = buf.getChannelData(0);
  const n = Math.min(d.length, Math.floor(buf.sampleRate * seconds));
  const b = new ArrayBuffer(44 + n * 2);
  const v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
  let bin = '';
  const u8 = new Uint8Array(b);
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function runAuto() {
  const params = new URLSearchParams(location.search);
  const out = [];
  let fails = 0;
  const log = (s) => { out.push(s); $('results').textContent = out.join('\n'); };
  log('músicas: ' + JSON.stringify(audio._songInfo()));
  for (const s of audio._songInfo()) if (s.warnings.length) { fails++; log('FAIL avisos ' + s.name + ': ' + s.warnings.join('; ')); }
  const wantWav = params.has('wav') ? { fart: 1.5, bark: 1, laugh: 2, level1: 10, bossRoar: 1.5, fart2: 1.5, fart3: 1.5 } : {};
  const sfxLen = { thunder: 3, bossDie: 2.5, bossRoar: 1.5, laugh: 1.8, cage: 1.3, cheer: 1, power: 0.8 };
  for (const n of audio.sfxNames) {
    try {
      const buf = await audio._renderOffline('sfx', n, sfxLen[n] || 0.8);
      const st = stats(buf);
      const minRms = n === 'step' ? 0.003 : 0.01; // passinho é baixinho de propósito
      const bad = st.rmsActive < minRms ? 'SILENCIOSO' : st.peak >= 1.0 ? 'CLIP' : 'ok';
      if (bad !== 'ok') fails++;
      log(`sfx   ${n.padEnd(10)} rmsAtivo=${st.rmsActive.toFixed(3)} pico=${st.peak.toFixed(3)} dur=${st.active.toFixed(2)}s ${bad}`);
      if (wantWav[n]) addWav(n, wavBase64(buf, wantWav[n]));
    } catch (e) { fails++; log(`sfx   ${n} ERRO ${e && e.message}`); }
  }
  if (params.has('wav')) {
    for (const k of ['fart2', 'fart3']) { const b = await audio._renderOffline('sfx', 'fart', 1); addWav(k, wavBase64(b, 1)); }
    const big = await audio._renderOffline('sfx', 'fart', 1.2); // pitch default
    addWav('fart4', wavBase64(big, 1.2));
  }
  for (const n of audio.musicNames) {
    try {
      const secs = n === 'level1' && params.has('wav') ? 10 : 8;
      const buf = await audio._renderOffline('music', n, secs);
      const st = stats(buf);
      const bad = st.rms < 0.01 ? 'SILENCIOSO' : st.peak >= 1.0 ? 'CLIP' : 'ok';
      if (bad !== 'ok') fails++;
      log(`music ${n.padEnd(10)} rms=${st.rms.toFixed(3)} pico=${st.peak.toFixed(3)} ativo=${st.active.toFixed(2)}s ${bad}`);
      if (wantWav[n]) addWav(n, wavBase64(buf, wantWav[n]));
    } catch (e) { fails++; log(`music ${n} ERRO ${e && e.message}`); }
  }
  // caminho em tempo real (sem gesto: headless com --autoplay-policy liberado)
  try {
    audio.sfx('fart'); // antes do unlock: no-op
    audio.playMusic('title'); // pendente
    await audio.playVoice('nada');
    audio.unlock();
    await new Promise((r) => setTimeout(r, 300));
    audio.playMusic('level1');
    for (const n of audio.sfxNames) audio.sfx(n);
    audio.setMuted(true); audio.sfx('fart'); audio.setMuted(false);
    audio.playMusic('boss');
    audio.pause(); audio.resume();
    const t0 = performance.now();
    const p = audio.playVoice('fake');
    await new Promise((r) => setTimeout(r, 200));
    audio.voiceLevel();
    audio.stopVoice();
    await p;
    log(`tempo real: ok (musica=${audio.musicName}, voz fallback parada em ${(performance.now() - t0).toFixed(0)}ms)`);
    // voz a partir de arquivo (data URL gerada aqui) -> buffer + analyser + ducking
    const lb = await audio._renderOffline('sfx', 'laugh', 1.8);
    await audio.loadVoice('teste', 'data:audio/wav;base64,' + wavBase64(lb, 1.8), 'teste');
    const dur = audio.voiceDuration('teste');
    let maxLvl = 0;
    const t1 = performance.now();
    const pv = audio.playVoice('teste');
    const iv = setInterval(() => { maxLvl = Math.max(maxLvl, audio.voiceLevel()); }, 16);
    await pv;
    clearInterval(iv);
    const took = (performance.now() - t1) / 1000;
    const okVoice = dur && Math.abs(took - dur) < 0.4 && maxLvl > 0.2;
    if (!okVoice) fails++;
    log(`voz arquivo: dur=${dur && dur.toFixed(2)}s tocou=${took.toFixed(2)}s nivelMax=${maxLvl.toFixed(2)} ${okVoice ? 'ok' : 'FALHA'}`);
    audio.stopMusic(0.1);
  } catch (e) { fails++; log('tempo real ERRO ' + (e && e.stack || e)); }
  if (errors.length) { fails += errors.length; log('ERROS: ' + errors.join(' | ')); }
  log(fails ? `RESULTADO: ${fails} FALHA(S)` : 'RESULTADO: TUDO OK');
  document.title = 'DONE';
  const d = document.createElement('div'); d.id = 'done'; d.textContent = 'DONE'; document.body.appendChild(d);
}
function addWav(name, b64) {
  const t = document.createElement('textarea');
  t.id = 'wav-' + name;
  t.value = b64;
  $('wavs').appendChild(t);
}
if (new URLSearchParams(location.search).has('auto')) runAuto();
</script>
</body>
</html>
